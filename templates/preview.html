<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Preview - ExamGuru</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ccc; }
        input, select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { background: #4caf50; color: white; padding: 12px; border: none; border-radius: 5px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #43a047; }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{ quiz.title }}</h2>
        <p>Total Questions: <b>{{ quiz.questions|length }}</b></p>
        
        <form action="/play-group/{{ quiz_id }}" method="POST" style="background: #252525; padding: 15px; border-radius: 6px; margin-top: 20px;">
            <h3>🚀 Start Live Quiz in Group</h3>
            
            <div class="form-group">
                <label>Admin Telegram User ID:</label>
                <input type="text" name="admin_id" value="{{ owner_id }}" required>
            </div>

            <div class="form-group">
                <label>Telegram Group Username (e.g., @exam_group):</label>
                <input type="text" name="group_id" placeholder="@group_username" required>
            </div>

            <div class="form-group">
                <label>Timer per Question (Seconds):</label>
                <input type="text" name="timer" value="35" required>
            </div>

            <div class="form-group">
                <label>Negative Marking:</label>
                <select name="negative_marking">
                    <option value="-0.33">-0.33 (1/3th)</option>
                    <option value="-0.25">-0.25 (1/4th)</option>
                    <option value="-0.5">-0.5 (1/2th)</option>
                    <option value="0">0 (No Negative Marking)</option>
                </select>
            </div>

            <button type="submit">Start Live Quiz Now / लाइव क्विज़ शुरू करें</button>
        </form>
        
        <br>
        <a href="/" style="color: #2196f3; text-decoration: none;">← Back to Home / होम पेज पर जाएं</a>
    </div>
</body>
</html>
