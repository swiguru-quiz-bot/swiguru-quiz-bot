<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamGuru Quiz Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #f4f6f9; color: #333; margin: 0; }
        .container { background: #fff; padding: 20px; border-radius: 10px; max-width: 450px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0088cc; }
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; }
        input, button { width: 100%; padding: 12px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { background: #0088cc; color: white; border: none; margin-top: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #006699; }
        .quiz-list { margin-top: 30px; border-top: 2px solid #eee; padding-top: 15px; }
        .quiz-item { background: #eef2f7; padding: 12px; border-radius: 6px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .quiz-actions { display: flex; gap: 5px; }
        .quiz-item a { text-decoration: none; background: #28a745; color: white; padding: 6px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .quiz-item button { background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-top: 0; cursor: pointer; width: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ExamGuru Control Panel</h2>
        <form action="/upload-quiz" method="POST" enctype="multipart/form-data">
            <label>Telegram User ID:</label>
            <input type="text" name="admin_id" value="{{ owner_id }}" required>

            <label>Quiz Title / Name:</label>
            <input type="text" name="quiz_title" placeholder="Jaise: Railway Leave Rules" required>

            <label>Upload Quiz File (.json, .txt, .pdf):</label>
            <input type="file" name="file" required>
            
            <button type="submit">Upload & Review Quiz</button>
        </form>

        <div class="quiz-list">
            <h3>📚 Saved Quizzes Library</h3>
            {% if quizzes %}
                {% for q_id, q_data in quizzes.items() %}
                <div class="quiz-item">
                    <div>
                        <strong>{{ q_data.title }}</strong><br>
                        <small>{{ q_data.questions|length }} Sawaal</small>
                    </div>
                    <div class="quiz-actions">
                        <a href="/preview/{{ q_id }}">Review</a>
                        <form action="/delete-quiz/{{ q_id }}" method="POST" style="margin:0;">
                            <button type="submit" onclick="return confirm('Kya aap poori quiz delete karna chahte hain?');">Delete</button>
                        </form>
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <p style="color: #777; font-size: 13px;">Abhi koi quiz saved nahi hai.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
